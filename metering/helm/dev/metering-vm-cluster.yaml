global:
  imageRegistry: ""
  imagePullSecrets: []

clusterDomain: cluster.local

envflagEnable: true
envflagPrefix: VM_
loggerFormat: json

## @section VictoriaMetrics Select Parameters
vmselect:
  image:
    registry: docker.io
    repository: bitnami/victoriametrics-vmselect
    tag: 1.124.0-debian-12-r0
    pullPolicy: IfNotPresent

  replicaCount: 2

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi

  kind: "deployment"

  extraArgs:
    - "-search.maxQueryDuration=5m"
    - "-search.maxConcurrentRequests=16"
    - "-dedup.minScrapeInterval=30s"

  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

  affinity: {}
  nodeSelector: {}
  tolerations: []

  ingress:
    enabled: false
    pathType: ImplementationSpecific
    hostname: vmselect.local
    ingressClassName: ""
    path: /
    annotations: {}
    tls: false
    extraPaths: []

  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    extraIngress: []
    extraEgress: []

  ## @section VictoriaMetrics Select Metrics Parameters
  ##
  ## Prometheus metrics
  ##
  metrics:
    ## @param vmselect.metrics.enabled Enable the export of Prometheus metrics
    ##
    enabled: false
    ## @param vmselect.metrics.annotations Additional custom annotations for the service
    ##
    annotations: {}
    ## Prometheus Operator ServiceMonitor configuration
    ##
    serviceMonitor:
      ## @param vmselect.metrics.serviceMonitor.enabled if `true`, creates a Prometheus Operator ServiceMonitor (also requires `metrics.enabled` to be `true`)
      ##
      enabled: false
      ## @param vmselect.metrics.serviceMonitor.namespace Namespace in which Prometheus is running
      ##
      namespace: ""
      ## @param vmselect.metrics.serviceMonitor.annotations Additional custom annotations for the ServiceMonitor
      ##
      annotations: {}
      ## @param vmselect.metrics.serviceMonitor.labels Extra labels for the ServiceMonitor
      ##
      labels: {}
      ## @param vmselect.metrics.serviceMonitor.jobLabel The name of the label on the target service to use as the job name in Prometheus
      ##
      jobLabel: ""
      ## @param vmselect.metrics.serviceMonitor.honorLabels honorLabels chooses the metric's labels on collisions with target labels
      ##
      honorLabels: false
      ## @param vmselect.metrics.serviceMonitor.interval Interval at which metrics should be scraped.
      ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
      ## e.g:
      ## interval: 10s
      ##
      interval: ""
      ## @param vmselect.metrics.serviceMonitor.scrapeTimeout Timeout after which the scrape is ended
      ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
      ## e.g:
      ## scrapeTimeout: 10s
      ##
      scrapeTimeout: ""
      ## @param vmselect.metrics.serviceMonitor.metricRelabelings Specify additional relabeling of metrics
      ##
      metricRelabelings: []
      ## @param vmselect.metrics.serviceMonitor.relabelings Specify general relabeling
      ##
      relabelings: []
      ## @param vmselect.metrics.serviceMonitor.selector Prometheus instance selector labels
      ## ref: https://github.com/bitnami/charts/tree/main/bitnami/prometheus-operator#prometheus-configuration
      ## selector:
      ##   prometheus: my-prometheus
      ##
      selector: {}

## @section VictoriaMetrics Insert Parameters
##
vminsert:
  image:
    registry: docker.io
    repository: bitnami/victoriametrics-vminsert
    tag: 1.124.0-debian-12-r0
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 2

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi

  extraArgs:
    - "-replicationFactor=3"
    - "-maxLabelsPerTimeseries=40"
    -
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

  affinity: {}
  tolerations: []

  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    extraIngress: []
    extraEgress: []
    ingressNSMatchLabels: {}
    ingressNSPodMatchLabels: {}

vmstorage:
  image:
    registry: docker.io
    repository: bitnami/victoriametrics-vmstorage
    tag: 1.124.0-debian-12-r0
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 3

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

  retentionPeriod: 3

  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

  affinity: {}
  nodeSelector: {}
  tolerations: []

  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    extraIngress: []
    extraEgress: []

  persistence:
    enabled: true
    mountPath: /data
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    dataSource: {}

vmauth:
  enabled: false

## @section VictoriaMetrics Agent Parameters
vmagent:
  enabled: false

## @section VictoriaMetrics Alert Parameters
vmalert:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/victoriametrics-vmalert
    tag: 1.124.0-debian-12-r0
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicaCount: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  datasourceUrl: "http://vm-vmselect.metering.svc.cluster.local:8481/select/0/prometheus"

  notifierUrl: ""

  extraArgs:
    - "-remoteWrite.url=http://vm-vminsert.monitoring.svc.cluster.local:8480/insert/0/prometheus"
    - "-remoteRead.url=http://vm-vmselect.monitoring.svc.cluster.local:8481/select/0/prometheus"
    - "-evaluationInterval=30s"
    - "-external.label=cluster=central"

  existingRulesConfigMap: ""

  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    extraIngress: []
    extraEgress: []