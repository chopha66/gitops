---
# Source: victoriametrics/templates/vmstorage/networkpolicy.yaml
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: metering-victoriametrics-vmstorage
  namespace: "default"
  labels:
    app.kubernetes.io/instance: metering
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/version: 1.124.0
    helm.sh/chart: victoriametrics-0.1.31
    app.kubernetes.io/part-of: victoriametrics
    app.kubernetes.io/component: vmstorage
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: metering
      app.kubernetes.io/name: victoriametrics
      app.kubernetes.io/part-of: victoriametrics
      app.kubernetes.io/component: vmstorage
  egress:
    - {}
  ingress:
    # Allow inbound connections
    - ports:
        - port: 8482
        - port: 8400
        - port: 8401
